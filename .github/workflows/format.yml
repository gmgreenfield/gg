name: Check C formatting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format

      - name: Configure CMake
        run: cmake -S . -B build/format

      - name: Check formatting
        run: cmake --build build/format --target format-check
